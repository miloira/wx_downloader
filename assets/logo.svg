<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DC84D"/>
      <stop offset="100%" stop-color="#06B44C"/>
    </linearGradient>
  </defs>

  <!-- Clean circle background -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)"/>

  <!-- Chat bubble - centered -->
  <path d="M30 58 C30 42 45 29 64 29 C83 29 98 42 98 58 C98 74 83 87 64 87 C60.5 87 57 86.5 54 85.5 L40 93 L44 83.5 C35.5 78.5 30 69 30 58 Z" 
        fill="#FFFFFF"/>

  <!-- Two green eyes -->
  <circle cx="51" cy="56" r="5" fill="#2DC84D"/>
  <circle cx="77" cy="56" r="5" fill="#2DC84D"/>

  <!-- Download badge, bottom-right (kept inside the green circle) -->
  <g transform="translate(-8,-8)">
    <!-- Ring painted with the background colour so the badge reads as a layer in front of the bubble -->
    <circle cx="96" cy="96" r="21" fill="#FFFFFF" stroke="url(#bg)" stroke-width="3"/>
    <g fill="none" stroke="#06B44C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 85 V99"/>
      <path d="M89.5 92.5 L96 99 L102.5 92.5"/>
      <path d="M87 103.5 v2.2 a2.8 2.8 0 0 0 2.8 2.8 h12.4 a2.8 2.8 0 0 0 2.8 -2.8 v-2.2"/>
    </g>
  </g>
</svg>
